name: Daily Event Scrape

# Runs every day at 03:00 UTC.
# NOTE: GitHub only runs scheduled workflows on the default (main) branch.
# Merge your PR first, then this automation activates automatically.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install --legacy-peer-deps

      - name: Install scraper packages
        run: npm install puppeteer axios cheerio --legacy-peer-deps

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run event scraper
        run: node eventScraper.js

      - name: Commit and push updated events
        run: |
          git config user.name "Randevu Bot"
          git config user.email "bot@randevu.app"
          git add src/data/scraped_events.json
          git diff --staged --quiet \
            || git commit -m "chore: auto-scrape events $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
